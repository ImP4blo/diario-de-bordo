[project]
name = "diario-de-bordo"
version = "0.1.0"
description = "Voice-powered work log: transcribes your day and turns it into a structured Word diary with AI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.1.0",
    "fastapi>=0.161.0",
    "google-genai>=2.33.0",
    "groq>=1.7.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "python-docx>=1.2.0",
    "sqlmodel>=0.0.48",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrações são geradas pelo Alembic: não vale a pena brigar com o estilo delas
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/F: erros básicos | I: ordem dos imports | UP: sintaxe moderna | B: bugs comuns
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Modo estrito: qualquer aviso vira erro (pega problemas cedo). Exceção para um
# aviso de dentro da biblioteca do Google no Python 3.14, que não é nosso.
filterwarnings = [
    "error",
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]
