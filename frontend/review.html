<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Revisão · Diário de Bordo</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__brand">
        <h1 class="topbar__title">Revisão do diário</h1>
        <p id="period" class="topbar__credit"></p>
      </div>
      <a class="link-chip" href="/">← Voltar</a>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="controls">
          <button id="btn-generate" class="btn btn--primary" type="button">🤖 Gerar com IA</button>
          <button id="btn-save" class="btn" type="button" disabled>💾 Salvar revisão</button>
          <button id="btn-word" class="btn btn--ghost" type="button" disabled title="Chega na etapa 8">
            ⬇ Baixar Word
          </button>
        </div>
        <p class="hint">
          Confira e ajuste cada bloco antes de baixar. A IA pode errar: o diário final é seu.
        </p>
        <p id="message" class="message" hidden></p>
      </section>

      <div id="days" class="review-days"></div>
    </main>

    <template id="day-template">
      <section class="panel review-day">
        <header class="review-day__header">
          <h2 class="review-day__title"></h2>
          <span class="review-day__status"></span>
        </header>
        <ol class="review-blocks"></ol>
        <button class="btn btn--ghost btn--small review-day__add" type="button">+ Adicionar bloco</button>
      </section>
    </template>

    <template id="block-template">
      <li class="review-block">
        <div class="review-block__times">
          <input class="review-block__start" type="time" aria-label="Início" required />
          <span aria-hidden="true">às</span>
          <input class="review-block__end" type="time" aria-label="Fim" required />
        </div>
        <input class="review-block__activity" placeholder="Atividade" aria-label="Atividade" required />
        <textarea class="review-block__description" rows="2" placeholder="Descrição (opcional)" aria-label="Descrição"></textarea>
        <button class="btn btn--small btn--ghost review-block__remove" type="button">Remover</button>
      </li>
    </template>

    <script type="module" src="js/review.js"></script>
  </body>
</html>
