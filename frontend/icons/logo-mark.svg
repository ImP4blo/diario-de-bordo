<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Diário de Bordo">
  <!-- Símbolo do Diário de Bordo: a voz (onda sonora) que vira diário (folha),
       com o ponto verde de "gravando". -->
  <defs>
    <linearGradient id="db-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7bf0" />
      <stop offset="1" stop-color="#1c46a3" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#db-bg)" />
  <!-- folha do caderno -->
  <rect x="15" y="11" width="34" height="43" rx="6" fill="#fff" />
  <!-- onda sonora (centralizada na folha): a fala virando registro -->
  <g fill="#2f6fde">
    <rect x="21.3" y="29" width="3.4" height="8" rx="1.7" />
    <rect x="27.3" y="23" width="3.4" height="20" rx="1.7" />
    <rect x="33.3" y="19" width="3.4" height="28" rx="1.7" />
    <rect x="39.3" y="26" width="3.4" height="14" rx="1.7" />
  </g>
  <!-- linha de "texto" embaixo: o registro escrito -->
  <rect x="21.3" y="48" width="16" height="2.6" rx="1.3" fill="#c8d4eb" />
  <!-- ponto de "gravando" -->
  <circle cx="47" cy="13" r="7" fill="#1f9d55" stroke="#fff" stroke-width="2.5" />
</svg>
