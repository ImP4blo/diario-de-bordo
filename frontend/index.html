<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diário de Bordo</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="topbar__title">Diário de Bordo</h1>
      <div id="status" class="status status--idle" role="status" aria-live="polite">
        <span class="status__dot" aria-hidden="true"></span>
        <span id="status-label">Parado</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel" aria-labelledby="recorder-title">
        <h2 id="recorder-title" class="visually-hidden">Gravação</h2>
        <div class="controls">
          <button id="btn-start" class="btn btn--primary" type="button">Iniciar</button>
          <button id="btn-pause" class="btn btn--warn" type="button" hidden>Pausar</button>
          <button id="btn-resume" class="btn btn--primary" type="button" hidden>Retomar</button>
          <button id="btn-stop" class="btn btn--danger" type="button" hidden>Encerrar dia</button>
        </div>
        <p id="interim" class="interim" aria-live="polite"></p>
        <p id="message" class="message" hidden></p>
        <p id="outbox" class="message" data-kind="warn" hidden></p>
      </section>

      <section class="panel" aria-labelledby="day-label">
        <nav class="day-nav" aria-label="Navegar entre dias">
          <button id="day-prev" class="btn btn--ghost" type="button" aria-label="Dia anterior">◀</button>
          <h2 id="day-label" class="day-nav__label"></h2>
          <button id="day-next" class="btn btn--ghost" type="button" aria-label="Próximo dia">▶</button>
          <button id="day-today" class="btn btn--ghost" type="button">Hoje</button>
        </nav>
        <ol id="entries" class="entries"></ol>
        <p id="empty" class="empty" hidden>Nada registrado neste dia.</p>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
